# Re-evaluates the merge gate when labels, the PR description, comments or reviews change, without rerunning
# the model. Runs the gate code from the default branch. See pr-checks.yml for the full checks.
name: Agent gate
on:
  pull_request:
    types: [labeled, unlabeled, edited, converted_to_draft]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions:
  contents: read
concurrency:
  group: agent-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  gate:
    name: agent-gate
    if: >
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))) &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      checks: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Load the gate from the default branch
        # The gate's code and policy are the default branch's copy, so a PR cannot change the rules that judge it.
        # Bootstrap only: before the gate exists on the default branch, the PR's copy is used, with a warning.
        run: |
          git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head:refs/remotes/pr/head"
          if [[ ! -f .github/scripts/agent_gate.py ]]; then
            echo "::warning::Bootstrap: the default branch has no merge gate yet, so this run uses the PR's copy."
            git checkout refs/remotes/pr/head -- .github/scripts .github/merge-policy.json
          fi
      - name: Set statuses, update the gate comment, merge if allowed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_AUTOMERGE: ${{ vars.AGENT_AUTOMERGE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          python3 .github/scripts/agent_gate.py gate --pr "${{ github.event.pull_request.number || github.event.issue.number }}"
          --event "${{ github.event.action }}" --label "${{ github.event.label.name }}"
          --event-head "${{ github.event.pull_request.head.sha }}"
