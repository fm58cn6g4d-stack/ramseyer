[project]
name = "billmap"
version = "0.0.1"
description = "Map draft bills onto the U.S. Code, checked against an OLRC release point."
requires-python = ">=3.11"
dependencies = [
    "lxml>=5",
    "pydantic>=2",
    "httpx>=0.27",
    "typer>=0.12",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
billmap = "billmap.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live government sources (deselect with -m 'not network')"]
